content:
  docs_markdown: '### What happens without a license


    The pipeline runs in **community mode** (degraded):


    - Only free lint defaults are enabled (markdown, frontmatter, SEO/GEO report-only)

    - Advanced modules are disabled (gap detection, glossary sync, lifecycle, API-first,
    multi-protocol, KPI/SLA, RAG prep/retrieval, PDF/i18n/custom packs)

    - No protocol entitlement is granted in community mode


    ### License file location


    License JWT is stored at `<client-repo>/docsops/license.jwt`. The public key for
    verification is at `<client-repo>/docsops/keys/veriops-licensing.pub`.


    ### Dev/test bypass


    For local development and testing, set the environment variable:


    ```bash

    export VERIOPS_LICENSE_PLAN=enterprise

    ```


    This bypasses JWT validation entirely.


    ---


    ## Troubleshooting'
