content:
  docs_markdown: "## Stream answers as they generate\n\nThe runtime streams answers\
    \ token by token over the `POST /api/v1/ask/stream` endpoint. The widget renders\
    \ each token as it arrives, so readers watch the answer form in real time instead\
    \ of waiting for the full reply. Send the same request body as the standard endpoint:\n\
    \n=== \"cURL\"\n\n```bash smoke\n    curl -N -X POST https://docs.example.com/ask-ai/api/v1/ask/stream\
    \ \\\n      -H \"Content-Type: application/json\" \\\n      -H \"X-Ask-AI-Key:\
    \ YOUR_PUBLIC_OR_PROXY_KEY\" \\\n      -d '{\"question\": \"How do I rotate API\
    \ keys?\", \"history\": []}'\n    ```\n\n=== \"JavaScript\"\n\n```javascript smoke\n\
    \    const response = await fetch('https://docs.example.com/ask-ai/api/v1/ask/stream',\
    \ {\n      method: 'POST',\n      headers: {\n        \"Content-Type\": \"application/json\"\
    ,\n        \"X-Ask-AI-Key\": \"YOUR_PUBLIC_OR_PROXY_KEY\",\n      },\n      body:\
    \ JSON.stringify({\"question\": \"How do I rotate API keys?\", \"history\": []}),\n\
    \    });\n    const payload = await response.json();\n    console.log(payload);\n\
    \    ```\n\n=== \"Python\"\n\n```python smoke\n    import requests"
