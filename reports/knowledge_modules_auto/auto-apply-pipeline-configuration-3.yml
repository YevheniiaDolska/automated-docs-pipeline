content:
  docs_markdown: "### Full+RAG\n\nUse `full+RAG` when retrieval quality is part of\
    \ the contract.\n\n```yaml\nlicensing:\n  plan: \"enterprise\"\nruntime:\n  modules:\n\
    \    gap_detection: true\n    drift_detection: true\n    docs_contract: true\n\
    \    kpi_sla: true\n    rag_optimization: true\n    ontology_graph: true\n   \
    \ retrieval_evals: true\n```\n\n## Step 3: Set the execution mode\n\n### Cloud\n\
    \n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"external_preferred\"\n  \
    \  external_llm_allowed: true\n    require_explicit_approval: false\n    redact_before_external:\
    \ true\n```\n\n### Strict-local\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode:\
    \ \"local_default\"\n    external_llm_allowed: false\n    require_explicit_approval:\
    \ true\n    redact_before_external: true\n```\n\n### Hybrid\n\n```yaml\nruntime:\n\
    \  llm_control:\n    llm_mode: \"local_default\"\n    external_llm_allowed: true\n\
    \    require_explicit_approval: true\n    redact_before_external: true\n```\n\n\
    Use `require_explicit_approval: false` in `hybrid` only if the client allows automatic\
    \ external fallback."
  assistant_context: "Use this module when answering questions related to: Apply a\
    \ pilot, full, or RAG configuration (Part 3). Source path: how-to/apply-pipeline-configuration.md.\
    \ Summary: Update a client profile for pilot, full, or RAG-enabled operation and\
    \ align it with cloud, strict-local, or hybrid LLM execution.\n\n### Full+RAG\n\
    \nUse `full+RAG` when retrieval quality is part of the contract.\n\n```yaml\n\
    licensing:\n  plan: \"enterprise\"\nruntime:\n  modules:\n    gap_detection: true\n\
    \    drift_detection: true\n    docs_contract: true\n    kpi_sla: true\n    rag_optimization:\
    \ true\n    ontology_graph: true\n    retrieval_evals: true\n```\n\n## Step 3:\
    \ Set the execution mode\n\n### Cloud\n\n```yaml\nruntime:\n  llm_control:\n \
    \   llm_mode: \"external_preferred\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ false\n    redact_before_external: true\n```\n\n### Strict-local\n\n```yaml\n\
    runtime:\n  llm_control:\n    llm_mode: \"local_default\"\n    external_llm_allowed:\
    \ false\n    require_explicit_approval: true\n    redact_before_external: true\n\
    ```\n\n### Hybrid\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"local_default\"\
    \n    external_llm_allowed: true\n    require_explicit_approval: true\n    redact_before_external:\
    \ true\n```\n\nUse `require_explicit_approval: false` in `hybrid` only if the\
    \ client allows automatic external fallback."
