content:
  docs_markdown: "<!-- VERIDOC_POWERED_BADGE:START -->\n[![Powered by VeriDoc](https://img.shields.io/badge/Powered%20by-VeriDoc-0ea5e9?style=flat-square)](https://veri-doc.app/)\n\
    <!-- VERIDOC_POWERED_BADGE:END -->\n\n# How pipeline configurations compose\n\n\
    Pipeline configuration is a two-axis model. One axis defines rollout scope, and\
    \ the other defines how LLM work is executed and governed.\n\n```yaml\nruntime:\n\
    \  modules:\n    rag_optimization: true\n    ontology_graph: true\n    retrieval_evals:\
    \ true\n  llm_control:\n    llm_mode: \"local_default\"\n    external_llm_allowed:\
    \ true\n```\n\n<!-- glossary:add: strict-local mode | LLM execution mode that\
    \ keeps llm_mode local_default and blocks external LLM egress by setting external_llm_allowed\
    \ to false. | local-only mode -->\n\nThis model matters because a `pilot` bundle\
    \ in `strict-local mode` should carry different scripts, governance, and user\
    \ instructions than a `full+RAG` bundle in `cloud` mode."
