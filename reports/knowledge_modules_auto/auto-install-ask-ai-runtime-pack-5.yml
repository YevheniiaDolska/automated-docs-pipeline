    \        json={'question': 'How do I rotate API keys?', 'history': []},\n    \
    \    timeout=30,\n    )\n    response.raise_for_status()\n    print(response.json())\n\
    \    ```\n\nThe stream sends one event per token, then a final event with the\
    \ citations and question identifier:\n\n```text\ndata: {\"type\": \"token\", \"\
    text\": \"Rotate \"}\n\ndata: {\"type\": \"done\", \"citations\": [...], \"question_id\"\
    : \"...\", \"grounded\": true}\n```\n\n## Keep conversation context for follow-up\
