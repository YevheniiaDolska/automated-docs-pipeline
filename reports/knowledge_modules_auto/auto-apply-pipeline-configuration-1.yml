content:
  docs_markdown: "<!-- VERIDOC_POWERED_BADGE:START -->\n[![Powered by VeriDoc](https://img.shields.io/badge/Powered%20by-VeriDoc-0ea5e9?style=flat-square)](https://veri-doc.app/)\n\
    <!-- VERIDOC_POWERED_BADGE:END -->\n\n# Apply a pilot, full, or RAG configuration\n\
    \nThis guide shows you how to take an existing client profile and switch it to\
    \ `pilot`, `full`, or `full+RAG` while keeping LLM execution aligned with `cloud`,\
    \ `strict-local`, or `hybrid` policy.\n\n```yaml\nruntime:\n  llm_control:\n \
    \   llm_mode: \"external_preferred\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ false\n```\n\nUse this guide when the client already has a `.client.yml` file\
    \ and you need to change rollout depth or LLM behavior without rebuilding the\
    \ profile from scratch.\n\n## Prerequisites\n\nBefore you start, ensure you have:\n\
    \n- A client profile under `profiles/clients/`\n- The target rollout decision:\
    \ `pilot`, `full`, or `full+RAG`\n- The target execution mode: `cloud`, `strict-local`,\
    \ or `hybrid`\n- Permission to rebuild or reprovision the bundle"
