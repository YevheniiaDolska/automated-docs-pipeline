content:
  docs_markdown: "## Step 2: Pick the execution mode\n\nExecution mode controls how\
    \ the bundle handles LLM work.\n\n| Execution mode | Use this when | `llm_control`\
    \ pattern |\n| --- | --- | --- |\n| `cloud` | You want the fastest external-model\
    \ path | `llm_mode: external_preferred`, `external_llm_allowed: true` |\n| `strict-local`\
    \ | You cannot allow external LLM egress | `llm_mode: local_default`, `external_llm_allowed:\
    \ false` |\n| `hybrid` | You want local-first execution with external fallback\
    \ | `llm_mode: local_default`, `external_llm_allowed: true` |\n\nRecommended starting\
    \ values:\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"local_default\"\
    \n    external_llm_allowed: true\n    require_explicit_approval: true\n    redact_before_external:\
    \ true\n```\n\nUse `cloud` when response quality and speed matter more than local-only\
    \ controls. Use `strict-local` when policy blocks external LLM traffic. Use `hybrid`\
    \ when you want local-first behavior but still need fallback for harder synthesis\
    \ tasks."
