terms:
  workflow:
    description: A sequence of connected nodes that process data
    aliases:
    - flow
    - automation
    - pipeline
    locales:
      ru:
        preferred: "\u0440\u0430\u0431\u043E\u0447\u0438\u0439 \u043F\u0440\u043E\u0446\
          \u0435\u0441\u0441"
        match:
        - "\u0440\u0430\u0431\u043E\u0447"
        - workflow
        forbidden:
        - stem: "\u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0447\u0435\
            \u0441\u043A\u0430\u044F \u043A\u0430\u0440\u0442\u0430"
          reason: Means "process chart" - a document, not an executable object
        risk: medium
  node:
    description: A single step in a workflow that performs an action
    aliases:
    - step
    - block
    - component
    locales:
      ru:
        preferred: "\u0443\u0437\u0435\u043B"
        match:
        - "\u0443\u0437\u0435\u043B"
        - "\u0443\u0437\u043B"
        forbidden:
        - stem: "\u0442\u043E\u0447\u043A"
          reason: Means "point" - loses the executable-step meaning entirely
        risk: medium
  trigger:
    description: A node that starts workflow execution
    aliases:
    - start node
    - initiator
    locales:
      ru:
        preferred: "\u0442\u0440\u0438\u0433\u0433\u0435\u0440"
        match:
        - "\u0442\u0440\u0438\u0433\u0433\u0435\u0440"
        forbidden:
        - stem: "\u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u0435\
            \u043B"
          reason: Means "switch" - implies toggling state, not starting execution
        - stem: "\u0441\u043F\u0443\u0441\u043A\u043E\u0432"
          reason: Literal "trigger" as in a firearm; not the technical term
        risk: high
  execution:
    description: A single run of a workflow
    aliases:
    - run
    - instance
    locales:
      ru:
        preferred: "\u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435"
        match:
        - "\u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D"
        - "\u0437\u0430\u043F\u0443\u0441\u043A"
        forbidden:
        - stem: "\u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\
            \u043D"
          reason: Means "executive" - a false friend of "execution"
        risk: medium
  credential:
    description: Stored authentication data for external services
    aliases:
    - auth
    - authentication
    - secret
    locales:
      ru:
        preferred: "\u0443\u0447\u0451\u0442\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\
          \u044B\u0435"
        match:
        - "\u0443\u0447\u0435\u0442\u043D"
        - "\u0443\u0447\u0451\u0442\u043D"
        forbidden:
        - stem: "\u043F\u0430\u0440\u043E\u043B"
          reason: Means "password" - narrows credentials to one type, so readers store
            the wrong thing and omit tokens, keys, and certificates
        - stem: "\u0443\u0434\u043E\u0441\u0442\u043E\u0432\u0435\u0440\u0435\u043D"
          reason: Means "identity document" - a physical credential, not stored auth
            data
        risk: high
  webhook:
    description: HTTP endpoint that triggers workflows on incoming requests
    aliases:
    - HTTP trigger
    - web hook
    - API endpoint
    locales:
      ru:
        preferred: "\u0432\u0435\u0431\u0445\u0443\u043A"
        match:
        - "\u0432\u0435\u0431\u0445\u0443\u043A"
        - webhook
        forbidden:
        - stem: "\u0432\u0435\u0431-\u043F\u0435\u0440\u0435\u0445\u0432\u0430\u0442\
            \u0447\u0438\u043A"
          reason: Literal calque meaning "web interceptor" - implies the endpoint
            intercepts traffic rather than receives a callback
        - stem: "\u0432\u0435\u0431-\u043A\u0440\u044E\u043A"
          reason: Literal calque meaning "web hook" in the physical sense
        risk: high
  HTTP Request:
    description: Node that makes outbound HTTP calls
    aliases:
    - API call
    - REST call
    - fetch
  Code node:
    description: Node for custom JavaScript/Python logic
    aliases:
    - function node
    - script node
  IF node:
    description: Conditional branching node
    aliases:
    - condition
    - branch
    - switch
  item:
    description: A single data object passed between nodes
    aliases:
    - record
    - row
    - entry
    locales:
      ru:
        preferred: "\u044D\u043B\u0435\u043C\u0435\u043D\u0442"
        match:
        - "\u044D\u043B\u0435\u043C\u0435\u043D\u0442"
        forbidden:
        - stem: "\u0442\u043E\u0432\u0430\u0440"
          reason: Means "merchandise" - a commerce false friend of "item" that reads
            naturally and is completely wrong in a data-flow context
        - stem: "\u043F\u0440\u0435\u0434\u043C\u0435\u0442"
          reason: Means "physical object" - loses the data-object meaning
        risk: high
  expression:
    description: Dynamic value using {{ }} syntax
    aliases:
    - template
    - variable
    - placeholder
    locales:
      ru:
        preferred: "\u0432\u044B\u0440\u0430\u0436\u0435\u043D\u0438\u0435"
        match:
        - "\u0432\u044B\u0440\u0430\u0436\u0435\u043D\u0438"
        forbidden:
        - stem: "\u0444\u0440\u0430\u0437"
          reason: Means "phrase" - natural-language sense, not an evaluated expression
        risk: medium
  binary data:
    description: File attachments (images, PDFs, etc.)
    aliases:
    - file
    - attachment
    - blob
    locales:
      ru:
        preferred: "\u0434\u0432\u043E\u0438\u0447\u043D\u044B\u0435 \u0434\u0430\u043D\
          \u043D\u044B\u0435"
        match:
        - "\u0434\u0432\u043E\u0438\u0447\u043D"
        - "\u0431\u0438\u043D\u0430\u0440\u043D"
        forbidden:
        - stem: "\u0431\u0438\u043D\u0430\u0440\u043D\u0438\u043A"
          reason: Slang for "compiled executable" - a dangerous shift, since readers
            look for a program rather than an attached file
        risk: high
  cloud:
    description: Hosted SaaS version of the product
    aliases:
    - cloud version
    - hosted version
    - SaaS
  self-hosted:
    description: Running the product on your own infrastructure
    aliases:
    - on-premise
    - on-prem
    - local install
  error handling:
    description: Mechanisms for dealing with node failures
    aliases:
    - exception handling
    - failure handling
    locales:
      ru:
        preferred: "\u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0430 \u043E\u0448\
          \u0438\u0431\u043E\u043A"
        match:
        - "\u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A"
        forbidden:
        - stem: "\u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435\
            \ \u043E\u0448\u0438\u0431\u043E\u043A"
          reason: Means "fixing errors" - describes debugging by a developer, not
            runtime handling by the workflow
        risk: high
  retry:
    description: Automatic re-execution after failure
    aliases:
    - retry logic
    - auto-retry
    locales:
      ru:
        preferred: "\u043F\u043E\u0432\u0442\u043E\u0440\u043D\u0430\u044F \u043F\u043E\
          \u043F\u044B\u0442\u043A\u0430"
        match:
        - "\u043F\u043E\u0432\u0442\u043E\u0440\u043D"
        forbidden:
        - stem: "\u043F\u0435\u0440\u0435\u0437\u0430\u043F\u0443\u0441\u043A"
          reason: Means "restart" - implies re-running the whole workflow instead
            of re-executing the one failed node, which changes what the reader expects
            to happen to already-processed items
        - stem: "\u043E\u0442\u043A\u0430\u0442"
          reason: Means "rollback" - a different recovery mechanism entirely
        risk: high
  Term:
    description: Description
    aliases:
    - alias-one
    - alias-two
    usage_context:
    - docs/operations/UNIFIED_CLIENT_CONFIG.md
    - docs\operations\UNIFIED_CLIENT_CONFIG.md
    - docs\reference\intent-experiences\integrate-developer.md
    - docs\reference\intent-experiences\integrate-operator.md
    - docs/reference/intent-experiences/integrate-developer.md
    - docs/reference/intent-experiences/integrate-operator.md
  strict-local mode:
    description: LLM execution mode that keeps llm_mode local_default and blocks external
      LLM egress by setting external_llm_allowed to false.
    aliases:
    - local-only mode
    usage_context:
    - docs/concepts/pipeline-configuration-combinations.md
    - docs\concepts\pipeline-configuration-combinations.md
    - docs\reference\intent-experiences\integrate-developer.md
    - docs\reference\intent-experiences\integrate-operator.md
forbidden:
- term: simple
  reason: Subjective - what's simple to one user isn't to another
  use_instead: straightforward
- term: easy
  reason: Subjective and potentially condescending
  use_instead: You can quickly...
- term: just
  reason: Minimizes complexity, can frustrate users
  use_instead: Remove the word entirely
- term: obviously
  reason: If it were obvious, it wouldn't need documentation
  use_instead: Remove the word entirely
- term: please
  reason: Unnecessary politeness in technical docs
  use_instead: Direct imperative (Click, Select, Enter)
