content:
  docs_markdown: "- terminology governance:\n  - `sync_project_glossary.py` (syncs\
    \ glossary markers to `glossary.yml`)\n- multi-language examples standard:\n \
    \ - `generate_multilang_tabs.py`\n  - `validate_multilang_examples.py`\n  - `check_code_examples_smoke.py`\
    \ (including `expected-output` comparison for tagged blocks)\n- intent bundle\
    \ assembly via `build_all_intent_experiences.py` when enabled in `runtime.custom_tasks.weekly`\n\
    - Algolia search indexing (if enabled)\n  - generates Algolia records from docs\n\
    \  - uploads index records\n  - applies advanced config from `advanced_config_path`\
    \ (`settings`, `synonyms`, `rules`, `replicas`) when `apply_advanced_settings_on_upload=true`\n\
    - `custom_tasks.weekly` commands\n- consolidated report generation\n\nOutput:\n\
    \n- `reports/consolidated_report.json`\n- related reports are regenerated to the\
    \ same filenames each run (no manual cleanup required)\n- `reports/docsops_status.json`\
    \ (quick freshness/status check for non-technical users)\n- `reports/screenshot_manifest_build_report.json`\
    \ (capture metadata -> placement manifest build status)\n- `reports/screenshot_injection_report.json`\
    \ (screenshot placement status and `needs_review` queue)\n\nClient repo `.gitignore`\
    \ recommendation:\n\n```gitignore\nreports/docsops-weekly.log\n```"
