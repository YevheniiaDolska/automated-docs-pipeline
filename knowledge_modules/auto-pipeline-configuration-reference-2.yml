    \ | `true` | `false` | hosted model path |\n| `strict-local` | `local_default`\
    \ | `false` | `true` | no external egress |\n| `hybrid` | `local_default` | `true`\
    \ | `true` or `false` | local-first with fallback |\n\n## Preset mapping\n\n|\
    \ Preset | User-facing meaning | Notes |\n| --- | --- | --- |\n| `pilot-evidence`\
    \ | `pilot` | intentionally reduced script surface |\n| `small` | `full` | full\
    \ baseline without the larger startup defaults |\n| `startup` | `full+RAG` default\
