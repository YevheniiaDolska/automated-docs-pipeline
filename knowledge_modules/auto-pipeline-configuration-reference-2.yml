content:
  docs_markdown: "## Execution mode reference\n\n| Execution mode | `llm_mode` | `external_llm_allowed`\
    \ | `require_explicit_approval` | Typical use |\n| --- | --- | --- | --- | ---\
    \ |\n| `cloud` | `external_preferred` | `true` | `false` | hosted model path |\n\
    | `strict-local` | `local_default` | `false` | `true` | no external egress |\n\
    | `hybrid` | `local_default` | `true` | `true` or `false` | local-first with fallback\
    \ |\n\n## Preset mapping\n\n| Preset | User-facing meaning | Notes |\n| --- |\
    \ --- | --- |\n| `pilot-evidence` | `pilot` | intentionally reduced script surface\
    \ |\n| `small` | `full` | full baseline without the larger startup defaults |\n\
    | `startup` | `full+RAG` default | balanced full-scope preset with retrieval features\
    \ on |\n| `enterprise` | `full+RAG` strict | largest default surface with Ask\
    \ AI runtime support |\n\n## Minimum module sets\n\n### Pilot minimum\n\n```yaml\n\
    runtime:\n  modules:\n    gap_detection: true\n    drift_detection: true\n   \
    \ docs_contract: true\n    kpi_sla: true\n    normalization: true\n    snippet_lint:\
    \ true\n    self_checks: true\n    fact_checks: true\n    rag_optimization: false\n\
    \    ontology_graph: false\n    retrieval_evals: false\n```"
