content:
  docs_markdown: "## Step 1: Start from the nearest preset\n\nUse the preset that\
    \ is closest to the target state.\n\n| Target state | Recommended preset |\n|\
    \ --- | --- |\n| `pilot` | `profiles/clients/presets/pilot-evidence.yml` |\n|\
    \ `full` | `profiles/clients/presets/small.yml` or `startup.yml` |\n| `full+RAG`\
    \ | `profiles/clients/presets/startup.yml` or `enterprise.yml` |\n\nIf the profile\
    \ already exists, compare it to the preset before changing fields by hand.\n\n\
    ## Step 2: Set the scope tier\n\n### Pilot\n\nUse `pilot` when you need a narrow\
    \ proof bundle.\n\n```yaml\nlicensing:\n  plan: \"pilot\"\nruntime:\n  modules:\n\
    \    gap_detection: true\n    drift_detection: true\n    docs_contract: true\n\
    \    kpi_sla: true\n    rag_optimization: false\n    ontology_graph: false\n \
    \   retrieval_evals: false\n```\n\n### Full\n\nUse `full` when you want full docs\
    \ operations without forcing retrieval features.\n\n```yaml\nlicensing:\n  plan:\
    \ \"professional\"\nruntime:\n  modules:\n    gap_detection: true\n    drift_detection:\
    \ true\n    docs_contract: true\n    kpi_sla: true\n    normalization: true\n\
    \    snippet_lint: true\n    self_checks: true\n    fact_checks: true\n    rag_optimization:\
    \ false\n    ontology_graph: false\n    retrieval_evals: false\n```"
