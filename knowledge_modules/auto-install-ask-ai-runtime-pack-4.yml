content:
  docs_markdown: "## Stream answers as they generate\n\nThe runtime streams answers\
    \ token by token over the `POST /api/v1/ask/stream` endpoint. The widget renders\
    \ each token as it arrives, so readers watch the answer form in real time instead\
    \ of waiting for the full reply. Send the same request body as the standard endpoint:\n\
    \n```bash\ncurl -N -X POST https://docs.example.com/ask-ai/api/v1/ask/stream \\\
    \n  -H \"Content-Type: application/json\" \\\n  -H \"X-Ask-AI-Key: YOUR_PUBLIC_OR_PROXY_KEY\"\
    \ \\\n  -d '{\"question\": \"How do I rotate API keys?\", \"history\": []}'\n\
    ```\n\nThe stream sends one event per token, then a final event with the citations\
    \ and question identifier:\n\n```text\ndata: {\"type\": \"token\", \"text\": \"\
    Rotate \"}\n\ndata: {\"type\": \"done\", \"citations\": [...], \"question_id\"\
    : \"...\", \"grounded\": true}\n```\n\n## Keep conversation context for follow-up\
    \ questions\n\nSend prior turns in the `history` field so follow-up questions\
    \ read in context. Each turn is an object with a `role` of `user` or `assistant`\
    \ and a `content` string. The `ASK_AI_HISTORY_MAX_TURNS` environment variable\
    \ sets how many recent turns the server keeps, with a default of six. The widget\
    \ stores the conversation and sends it with each question, so a reader can ask\
    \ a follow-up such as \"How does that work in self-hosted mode?\" and receive\
    \ a contextual answer."
