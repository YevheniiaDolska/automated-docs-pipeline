    Bundles may also include additional documents such as API-first or Ask AI instructions
    when those features are enabled.


    ## Common issues and fixes


    ### Issue: Full bundle still looks like pilot


    Check `licensing.plan` and the three retrieval flags. If `plan` is still `pilot`,
    or all three retrieval flags are `false`, the profile is still scoped down.


    ### Issue: Strict-local bundle still attempts external LLM use


    Check `runtime.llm_control.external_llm_allowed`. It must be `false`. Also verify
    the generated bundle copies the expected `config/client_runtime.yml`.


    ### Issue: Full+RAG bundle does not ship retrieval guidance


    Rebuild the bundle after changing the profile. The bundle builder selects configuration
