content:
  docs_markdown: '## Why full and full+RAG are not the same


    A frequent mistake is assuming `full` automatically implies retrieval features.
    It does not.


    The difference is the retrieval triplet:


    - `rag_optimization`

    - `ontology_graph`

    - `retrieval_evals`


    When all three are `true`, the configuration behaves as `full+RAG`. When they
    are all `false`, the bundle is still full-scope docs operations, but not a retrieval-governed
    rollout.


    ## Why bundles need configuration-specific docs


    The same scripts are not enough across every configuration. Users need configuration-specific
    instructions because:


    - `pilot` users need proof-oriented operating steps

    - `full` users need broader automation and governance guidance

    - `full+RAG` users need retrieval quality and knowledge-system guidance

    - `strict-local` users need egress and local runtime instructions

    - `cloud` users need external-model behavior spelled out


    That is why the bundle builder now selects documentation from the final runtime
    config, not only from manual `include_docs` entries.'
