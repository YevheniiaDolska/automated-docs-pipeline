content:
  docs_markdown: "## Algolia advanced auto-optimization\n\nWhen `runtime.integrations.algolia.enabled=true`,\
    \ the provisioning and weekly flows support advanced zero-manual search optimization.\n\
    \n**Provisioning behavior (`provision_client_repo.py`):**\n\n1. Generates `config/algolia.search.yml`\
    \ if missing (settings, synonyms, rules, replicas).\n1. Generates search widget\
    \ helper script.\n1. If credentials exist, auto-bootstraps Algolia index (records\
    \ + advanced config apply).\n\n**Weekly behavior (`run_weekly_gap_batch.py`):**\n\
    \n1. Builds Algolia records from docs via `seo_geo_optimizer.py --algolia`.\n\
    1. Uploads records with `upload_to_algolia.py`.\n1. Passes advanced config path\
    \ and applies advanced settings automatically when enabled.\n\n**Runtime configuration\
    \ keys:**\n\n```yaml\nruntime:\n  integrations:\n    algolia:\n      enabled:\
    \ true\n      docs_dir: docs\n      report_output: reports/seo-report.json\n \
    \     upload_on_weekly: true\n      advanced_config_path: config/algolia.search.yml\n\
    \      apply_advanced_settings_on_upload: true\n      auto_optimize_on_provision:\
    \ true\n      ab_test_replica_suffix: docs_ab_variant\n```\n\n**Uploader flags\
    \ (`upload_to_algolia.py`):**\n\n- `--advanced-config <path>`: load YAML/JSON\
    \ with `settings`, `synonyms`, `rules`, and `replicas`.\n- `--apply-advanced`:\
    \ enable application of advanced objects in addition to records upload."
