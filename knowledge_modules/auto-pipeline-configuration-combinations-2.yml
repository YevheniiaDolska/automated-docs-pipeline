content:
  docs_markdown: "### Pilot\n\n`pilot` narrows the surface to proof-oriented signals:\n\
    \n- weekly gap and drift evidence\n- docs quality gates\n- API-first generation\
    \ if enabled\n- reduced bundle script surface\n\nPilot intentionally keeps retrieval\
    \ features off by default because the goal is short proof cycles, not full knowledge-system\
    \ rollout.\n\n### Full\n\n`full` turns on the standard docs operations surface:\n\
    \n- governance and normalization\n- docs-contract visibility\n- KPI and SLA reporting\n\
    - lifecycle and release pack flows\n\nFull can still be RAG-free. That is a valid\
    \ state when the client wants governed documentation operations without retrieval\
    \ evaluation or graph outputs.\n\n### Full+RAG\n\n`full+RAG` adds the retrieval\
    \ layer to full docs operations:\n\n- knowledge module extraction and validation\n\
    - retrieval index generation\n- knowledge graph output\n- retrieval quality evaluation\n\
    \nThis mode is appropriate when the client expects AI-facing documentation quality\
    \ to be measured, not only generated.\n\n## Execution mode is about LLM governance\n\
    \nExecution mode answers: where may synthesis run, and what fallback is allowed?\n\
    \n### Cloud\n\nCloud mode prefers external models:\n\n```yaml\nruntime:\n  llm_control:\n\
    \    llm_mode: \"external_preferred\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ false\n```\n\nUse this mode when external-model quality and latency matter more\
    \ than local-only execution controls."
