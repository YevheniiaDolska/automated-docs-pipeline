content:
  docs_markdown: '## Ground answers in documentation and refuse when uncertain


    The assistant answers only from the retrieved documentation sources and cites
    them inline with bracketed numbers such as `[1]`. The response returns a `citations`
    list that contains only the sources the answer references, plus a `grounded` flag.
    When retrieval returns no sources, or the sources do not cover the question, the
    runtime returns an honest refusal with `grounded` set to `false` and an empty
    `citations` list. The runtime records each refusal in the usage log, where it
    surfaces as a documentation-gap candidate in the analytics report.


    ## Collect reader feedback


    Each answer includes thumbs up and thumbs down controls. The widget posts the
    rating to the `POST /api/v1/feedback` endpoint with the `question_id` from the
    answer. Ratings feed the usage analytics and help rank which pages to improve
    first.'
