content:
  docs_markdown: "## Protect the endpoint and bill each user separately\n\nThe runtime\
    \ rate limits requests per user to protect the public endpoint and the provider\
    \ quota behind it. Set the budget with `ASK_AI_RATE_LIMIT_PER_USER_PER_MINUTE`\
    \ (default 20). The runtime keys the limit on the `X-User-Id` header, falling\
    \ back to the API key. A request over the budget returns HTTP 429 with a `Retry-After`\
    \ header.\n\nTo bill queries to each user rather than a shared key, send the user's\
    \ provider key per request:\n\n```bash\ncurl -X POST https://docs.example.com/ask-ai/api/v1/ask\
    \ \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Ask-AI-Key: YOUR_PUBLIC_OR_PROXY_KEY\"\
    \ \\\n  -H \"X-Provider-Key: USER_PROVIDER_KEY\" \\\n  -H \"X-Model: gpt-4.1-mini\"\
    \ \\\n  -d '{\"question\": \"How do I rotate API keys?\"}'\n```\n\nThe runtime\
    \ uses `X-Provider-Key` (and optional `X-Provider-Base-Url` and `X-Model`) for\
    \ that request, so the user pays for their own queries. Set `ASK_AI_BILLING_MODE=bring-your-own-key`\
    \ to require the header: a request without it returns HTTP 402."
