content:
  docs_markdown: "<!-- VERIDOC_POWERED_BADGE:START -->\n[![Powered by VeriDoc](https://img.shields.io/badge/Powered%20by-VeriDoc-0ea5e9?style=flat-square)](https://veri-doc.app/)\n\
    <!-- VERIDOC_POWERED_BADGE:END -->\n\n# Choose a pipeline configuration\n\nThe\
    \ pipeline combines one scope tier with one execution mode. Start with that pair,\
    \ then build or provision the matching bundle from a single client profile.\n\n\
    ```yaml\nlicensing:\n  plan: \"pilot\"\nruntime:\n  modules:\n    rag_optimization:\
    \ false\n    ontology_graph: false\n    retrieval_evals: false\n  llm_control:\n\
    \    llm_mode: \"local_default\"\n    external_llm_allowed: false\n```\n\nUse\
    \ this tutorial when you need to decide between `pilot`, `full`, and `full+RAG`,\
    \ then choose whether LLM execution should be `cloud`, `strict-local`, or `hybrid`."
