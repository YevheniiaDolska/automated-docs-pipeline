content:
  docs_markdown: "### Full minimum\n\n```yaml\nruntime:\n  modules:\n    gap_detection:\
    \ true\n    drift_detection: true\n    docs_contract: true\n    kpi_sla: true\n\
    \    terminology_management: true\n    normalization: true\n    snippet_lint:\
    \ true\n    self_checks: true\n    fact_checks: true\n    lifecycle_management:\
    \ true\n    knowledge_validation: true\n```\n\n### Full+RAG minimum\n\n```yaml\n\
    runtime:\n  modules:\n    gap_detection: true\n    drift_detection: true\n   \
    \ docs_contract: true\n    kpi_sla: true\n    terminology_management: true\n \
    \   normalization: true\n    snippet_lint: true\n    self_checks: true\n    fact_checks:\
    \ true\n    lifecycle_management: true\n    knowledge_validation: true\n    rag_optimization:\
    \ true\n    ontology_graph: true\n    retrieval_evals: true\n```\n\n## Flow alignment\
    \ rules\n\n| Field | Allowed values | Notes |\n| --- | --- | --- |\n| `runtime.docs_flow.mode`\
    \ | `code-first`, `api-first`, `hybrid` | `hybrid` is the default for most presets\
    \ |\n| `runtime.api_first.enabled` | `true`, `false` | Keep `true` for planning-notes\
    \ to contract flow |\n| `runtime.api_first.sandbox_backend` | `docker`, `prism`,\
    \ `external` | `external` requires a reachable mock URL |\n| `runtime.output_targets`\
    \ | list | examples: `mkdocs`, `readme`, `github`, `sphinx` |"
