content:
  docs_markdown: "### Full+RAG\n\n`full+RAG` adds the retrieval layer to full docs\
    \ operations:\n\n- knowledge module extraction and validation\n- retrieval index\
    \ generation\n- knowledge graph output\n- retrieval quality evaluation\n\nThis\
    \ mode is appropriate when the client expects AI-facing documentation quality\
    \ to be measured, not only generated.\n\n## Execution mode is about LLM governance\n\
    \nExecution mode answers: where may synthesis run, and what fallback is allowed?\n\
    \n### Cloud\n\nCloud mode prefers external models:\n\n```yaml\nruntime:\n  llm_control:\n\
    \    llm_mode: \"external_preferred\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ false\n```\n\nUse this mode when external-model quality and latency matter more\
    \ than local-only execution controls.\n\n### Strict-local\n\nStrict-local mode\
    \ keeps execution local and blocks external egress:\n\n```yaml\nruntime:\n  llm_control:\n\
    \    llm_mode: \"local_default\"\n    external_llm_allowed: false\n    require_explicit_approval:\
    \ true\n```\n\nUse this mode when policy requires local inference or forbids external\
    \ LLM traffic.\n\n### Hybrid\n\nHybrid mode keeps local-first behavior but permits\
    \ controlled fallback:\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"\
    local_default\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ true\n```\n\nUse this mode when the team wants local defaults but still needs\
    \ a path for harder synthesis tasks."
