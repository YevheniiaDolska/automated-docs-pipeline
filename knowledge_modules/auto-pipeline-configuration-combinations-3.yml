content:
  docs_markdown: "### Strict-local\n\nStrict-local mode keeps execution local and\
    \ blocks external egress:\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode:\
    \ \"local_default\"\n    external_llm_allowed: false\n    require_explicit_approval:\
    \ true\n```\n\nUse this mode when policy requires local inference or forbids external\
    \ LLM traffic.\n\n### Hybrid\n\nHybrid mode keeps local-first behavior but permits\
    \ controlled fallback:\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"\
    local_default\"\n    external_llm_allowed: true\n    require_explicit_approval:\
    \ true\n```\n\nUse this mode when the team wants local defaults but still needs\
    \ a path for harder synthesis tasks.\n\n## Why full and full+RAG are not the same\n\
    \nA frequent mistake is assuming `full` automatically implies retrieval features.\
    \ It does not.\n\nThe difference is the retrieval triplet:\n\n- `rag_optimization`\n\
    - `ontology_graph`\n- `retrieval_evals`\n\nWhen all three are `true`, the configuration\
    \ behaves as `full+RAG`. When they are all `false`, the bundle is still full-scope\
    \ docs operations, but not a retrieval-governed rollout."
