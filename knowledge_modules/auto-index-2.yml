content:
  docs_markdown: '## Quick reference


    **Data location:** Hetzner Cloud, Germany (EU)


    **Encryption:** TLS 1.3 in transit, AES-256 at rest


    **Password security:** PBKDF2-SHA256, 600,000 iterations


    **Data retention:** Account data kept 30 days after closure, then permanently
    deleted


    **LLM processing:** Opt-in only. Disable AI features to keep all content on VeriDoc
    infrastructure.


    **GDPR rights:** Access, correct, delete, export, restrict, object. Email <privacy@veri-doc.app>.


    ## Next steps


    - [Terms of service](terms-of-service.md)

    - [Privacy policy](privacy-policy.md)'
