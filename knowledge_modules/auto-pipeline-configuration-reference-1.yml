content:
  docs_markdown: "<!-- VERIDOC_POWERED_BADGE:START -->\n[![Powered by VeriDoc](https://img.shields.io/badge/Powered%20by-VeriDoc-0ea5e9?style=flat-square)](https://veri-doc.app/)\n\
    <!-- VERIDOC_POWERED_BADGE:END -->\n\n# Pipeline configuration reference\n\nThis\
    \ page defines the exact fields that distinguish `pilot`, `full`, and `full+RAG`,\
    \ plus the `cloud`, `strict-local`, and `hybrid` execution modes.\n\n```yaml\n\
    runtime:\n  llm_control:\n    llm_mode: \"external_preferred\"\n    external_llm_allowed:\
    \ true\n    require_explicit_approval: false\n```\n\nUse this page when you need\
    \ exact values, not rollout guidance.\n\n## Scope tier reference\n\n| Scope tier\
    \ | Preset or base profile | `licensing.plan` | Retrieval triplet |\n| --- | ---\
    \ | --- | --- |\n| `pilot` | `profiles/clients/presets/pilot-evidence.yml` | `pilot`\
    \ | all `false` |\n| `full` | `profiles/clients/presets/small.yml` or custom |\
    \ `professional` or `enterprise` | optional |\n| `full+RAG` | `profiles/clients/presets/startup.yml`\
    \ or `enterprise.yml` | `professional` or `enterprise` | all `true` |\n\n### Retrieval\
    \ triplet\n\nThe retrieval triplet is:\n\n- `runtime.modules.rag_optimization`\n\
    - `runtime.modules.ontology_graph`\n- `runtime.modules.retrieval_evals`\n\nInterpretation\
    \ rules:\n\n- all `false` -> not RAG-enabled\n- all `true` -> `full+RAG`\n- mixed\
    \ values -> transitional or custom rollout; document it explicitly"
