content:
  docs_markdown: '## 4. License enforcement


    Plan tiers are enforced at runtime by `scripts/license_gate.py`. Every gated script
    calls `license_gate.require("feature_name")` before executing protected logic.
    The license is validated offline using an Ed25519-signed JWT stored at `docsops/license.jwt`.


    Without a valid license, the pipeline runs in **community mode** (degraded):


    - Markdown lint, frontmatter validation, SEO/GEO report-only.

    - Advanced runtime modules are disabled in community mode (including glossary
    sync, lifecycle management, API-first/REST protocol automation, multi-protocol
    flow, drift detection, KPI/SLA, and RAG layers).

    - Existing client artifacts remain on disk (docs content, templates, glossary,
    shared variables), but pipeline execution falls back to the reduced community
    feature surface.

    - No scoring, no auto-fix, no drift detection, no KPI/SLA, no PDF reports, no
    multi-protocol.

    - Quality gates warn-only (never block).


    License features per plan:'
