content:
  docs_markdown: '## Configuration patterns that work well


    | Pattern | When it works best |

    | --- | --- |

    | `pilot + strict-local` | Early proof with tight security review |

    | `pilot + cloud` | Fastest demo path for a time-boxed proof |

    | `full + hybrid` | Standard production rollout with local-first governance |

    | `full+RAG + hybrid` | AI-facing docs program with controlled external fallback
    |

    | `full+RAG + cloud` | Maximum throughput and retrieval quality work on hosted
    models |


    ## Next steps


    - Use [Choose a pipeline configuration](../getting-started/choose-pipeline-configuration.md)
    to select the starting combination.

    - Follow [Apply a pilot, full, or RAG configuration](../how-to/apply-pipeline-configuration.md)
    to edit a profile.

    - Check [Pipeline configuration reference](../reference/pipeline-configuration-reference.md)
    for exact field values.'
