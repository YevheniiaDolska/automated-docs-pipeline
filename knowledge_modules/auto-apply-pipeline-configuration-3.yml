content:
  docs_markdown: "### Strict-local\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode:\
    \ \"local_default\"\n    external_llm_allowed: false\n    require_explicit_approval:\
    \ true\n    redact_before_external: true\n```\n\n### Hybrid\n\n```yaml\nruntime:\n\
    \  llm_control:\n    llm_mode: \"local_default\"\n    external_llm_allowed: true\n\
    \    require_explicit_approval: true\n    redact_before_external: true\n```\n\n\
    Use `require_explicit_approval: false` in `hybrid` only if the client allows automatic\
    \ external fallback.\n\n## Step 4: Align flow-specific settings\n\nIf the client\
    \ uses `api-first` or `hybrid` docs flow, confirm the API-first block is still\
    \ coherent.\n\n```yaml\nruntime:\n  docs_flow:\n    mode: \"hybrid\"\n  api_first:\n\
    \    enabled: true\n    generate_from_notes: true\n    sandbox_backend: \"prism\"\
    \n    generate_test_assets: true\n```\n\nIf the client uses retrieval features,\
    \ keep the knowledge outputs enabled and versioned:\n\n```yaml\nruntime:\n  retrieval_eval:\n\
    \    enabled: true\n    index_path: \"docs/assets/knowledge-retrieval-index.json\"\
    \n  knowledge_graph:\n    enabled: true\n    output_path: \"docs/assets/knowledge-graph.jsonld\"\
    \n```"
  assistant_context: "Use this module when answering questions related to: Apply a\
    \ pilot, full, or RAG configuration (Part 3). Source path: how-to/apply-pipeline-configuration.md.\
    \ Summary: Update a client profile for pilot, full, or RAG-enabled operation and\
    \ align it with cloud, strict-local, or hybrid LLM execution.\n\n### Strict-local\n\
    \n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"local_default\"\n    external_llm_allowed:\
    \ false\n    require_explicit_approval: true\n    redact_before_external: true\n\
    ```\n\n### Hybrid\n\n```yaml\nruntime:\n  llm_control:\n    llm_mode: \"local_default\"\
    \n    external_llm_allowed: true\n    require_explicit_approval: true\n    redact_before_external:\
    \ true\n```\n\nUse `require_explicit_approval: false` in `hybrid` only if the\
    \ client allows automatic external fallback.\n\n## Step 4: Align flow-specific\
    \ settings\n\nIf the client uses `api-first` or `hybrid` docs flow, confirm the\
    \ API-first block is still coherent.\n\n```yaml\nruntime:\n  docs_flow:\n    mode:\
    \ \"hybrid\"\n  api_first:\n    enabled: true\n    generate_from_notes: true\n\
    \    sandbox_backend: \"prism\"\n    generate_test_assets: true\n```\n\nIf the\
    \ client uses retrieval features, keep the knowledge outputs enabled and versioned:\n\
    \n```yaml\nruntime:\n  retrieval_eval:\n    enabled: true\n    index_path: \"\
    docs/assets/knowledge-retrieval-index.json\"\n  knowledge_graph:\n    enabled:\
    \ true\n    output_path: \"docs/assets/knowledge-graph.jsonld\"\n```"
