content:
  docs_markdown: '## Analyze usage by topic and session


    The analytics report clusters questions into topics and builds a session engagement
    funnel. Send an `X-Session-Id` header with each request so the runtime can group
    a conversation. Build the report and dashboard:


    ```bash

    npm run askai:analytics:build

    ```


    The dashboard shows answer rate per topic (which themes lack coverage) and the
    funnel from asked to answered to follow-up to helpful rating.


    ## Troubleshooting


    ### Runtime pack install fails because destination exists


    Use force mode:


    ```bash

    npm run askai:runtime:install:force

    ```


    ### Ask endpoint returns 401


    Check `X-Ask-AI-Key` header and `ASK_AI_API_KEY` value.


    ### Ask endpoint returns 402


    The current user plan is not entitled by billing mode logic. Confirm `ASK_AI_BILLING_MODE`
    and user plan header.'
