content:
  docs_markdown: "- gap detection\n- stale checks\n- drift + docs contract (if enabled)\n\
    \  - docs contract is report-only by default (no hard weekly blocking)\n  - consolidated\
    \ report includes only new/changed docs-contract mismatches, ignores closed ones,\
    \ and deduplicates overlap with other gap sources\n- KPI/SLA (if enabled)\n- API-first\
    \ flow (if enabled)\n  - supports `docker`, `prism` (no Docker), and `external`\
    \ public sandbox URL\n  - if `sync_playground_endpoint=true`, sandbox URL is auto-synced\
    \ into docs playground config\n  - manual overrides apply (`apply_openapi_overrides.py`)\n\
    \  - regression gate (`check_openapi_regression.py`)\n  - generates API test assets\
    \ from OpenAPI (`generate_api_test_assets.py`)\n  - optionally uploads test assets\
    \ to TestRail/Zephyr (`upload_api_test_assets.py`)\n- Multi-protocol API-first\
    \ flow (if non-REST protocols are enabled)\n  - runs `run_multi_protocol_contract_flow.py`\
    \ for GraphQL, gRPC, AsyncAPI, and WebSocket\n  - auto-generates server stubs\
    \ with business-logic placeholders (`generate_protocol_server_stubs.py`)\n  -\
    \ auto-resolves runtime endpoints for self-verification and docs testers\n  -\
    \ in `external` sandbox mode with `external_mock.enabled=true`, auto-prepares\
    \ Postman mock endpoint\n- RAG/knowledge tasks:\n  - `extract_knowledge_modules_from_docs.py`\n\
    \  - `validate_knowledge_modules.py`\n  - `generate_knowledge_retrieval_index.py`\n\
    \  - `generate_knowledge_graph_jsonld.py`\n  - `run_retrieval_evals.py` (Precision/Recall/Hallucination-rate)\n\
    - Screenshot placement tasks:\n  - `generate_screenshot_capture_plan.py` auto-refreshes\
    \ `docs/screenshots.capture.yml` from current docs tree\n  - `capture_screenshots.py`\
    \ captures screenshots via Playwright using `docs/screenshots.capture.yml`\n \
    \ - `build_screenshot_manifest.py` converts `reports/screenshot_capture_manifest.json`\
    \ into `docs/screenshots.yml`\n  - `insert_screenshots_into_docs.py` inserts screenshots\
    \ by `target.doc` + `target.anchor`/`target.heading`\n  - fallback placement after\
    \ `h1` for unresolved section headings\n  - unresolved targets are reported in\
    \ `reports/screenshot_injection_report.json` under `needs_review`"
