content:
  docs_markdown: "## Step 5: Build or provision the bundle\n\nBuild a distributable\
    \ bundle:\n\n```bash\npython3 scripts/build_client_bundle.py --client profiles/clients/acme.client.yml\n\
    ```\n\nProvision directly into a client repository:\n\n```bash\npython3 scripts/provision_client_repo.py\
    \ \\\n  --client profiles/clients/acme.client.yml \\\n  --client-repo /path/to/client-repo\
    \ \\\n  --install-scheduler linux\n```\n\n## Validation checklist\n\n- [ ] Scope\
    \ tier matches the client rollout: `pilot`, `full`, or `full+RAG`\n- [ ] Execution\
    \ mode matches policy: `cloud`, `strict-local`, or `hybrid`\n- [ ] `full+RAG`\
    \ bundles keep all three retrieval modules enabled\n- [ ] `strict-local` bundles\
    \ keep `external_llm_allowed: false`\n- [ ] The built bundle includes configuration\
    \ docs under `docs/`\n\n## Next steps\n\n- Read [How pipeline configurations compose](../concepts/pipeline-configuration-combinations.md)\
    \ for the model behind the matrix.\n- Follow [Apply a pilot, full, or RAG configuration](../how-to/apply-pipeline-configuration.md)\
    \ to edit an existing profile safely.\n- Use [Pipeline configuration reference](../reference/pipeline-configuration-reference.md)\
    \ for exact field values."
