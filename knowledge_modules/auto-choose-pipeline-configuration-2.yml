content:
  docs_markdown: '## Step 1: Pick the scope tier


    Choose the tier that matches the rollout depth you want in the client repository.


    | Scope tier | Use this when | Starting point | Key module pattern |

    | --- | --- | --- | --- |

    | `pilot` | You need proof in one week with a reduced script surface | `profiles/clients/presets/pilot-evidence.yml`
    | Core quality modules on, RAG modules off |

    | `full` | You want full docs operations without retrieval evaluation features
    | `profiles/clients/presets/small.yml` or a custom profile | Governance and weekly
    automation on, RAG modules optional |

    | `full+RAG` | You want retrieval index, graph, and eval gates in the same bundle
    | `profiles/clients/presets/startup.yml` or `enterprise.yml` | `rag_optimization`,
    `ontology_graph`, and `retrieval_evals` on |


    For `pilot`, use the preset as-is unless you have a narrow reason to expand scope.


    For `full`, keep the standard automation modules on:


    - `gap_detection`

    - `drift_detection`

    - `docs_contract`

    - `kpi_sla`

    - `normalization`

    - `snippet_lint`

    - `self_checks`

    - `fact_checks`


    For `full+RAG`, keep these three modules enabled together:


    - `rag_optimization`

    - `ontology_graph`

    - `retrieval_evals`'
