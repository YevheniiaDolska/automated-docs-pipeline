content:
  docs_markdown: "## Step 5: Rebuild the bundle\n\nAfter editing the profile, rebuild\
    \ the bundle:\n\n```bash\npython3 scripts/build_client_bundle.py --client profiles/clients/acme.client.yml\n\
    ```\n\nIf you are installing directly into a repo, reprovision it:\n\n```bash\n\
    python3 scripts/provision_client_repo.py \\\n  --client profiles/clients/acme.client.yml\
    \ \\\n  --client-repo /path/to/client-repo \\\n  --install-scheduler linux\n```\n\
    \n## Step 6: Verify the included docs\n\nEvery generated bundle should now include\
    \ the configuration docs that match its profile. Check for:\n\n- `docs/getting-started/choose-pipeline-configuration.md`\n\
    - `docs/how-to/apply-pipeline-configuration.md`\n- `docs/concepts/pipeline-configuration-combinations.md`\n\
    - `docs/reference/pipeline-configuration-reference.md`\n\nBundles may also include\
    \ additional documents such as API-first or Ask AI instructions when those features\
    \ are enabled.\n\n## Common issues and fixes\n\n### Issue: Full bundle still looks\
    \ like pilot\n\nCheck `licensing.plan` and the three retrieval flags. If `plan`\
    \ is still `pilot`, or all three retrieval flags are `false`, the profile is still\
    \ scoped down.\n\n### Issue: Strict-local bundle still attempts external LLM use\n\
    \nCheck `runtime.llm_control.external_llm_allowed`. It must be `false`. Also verify\
    \ the generated bundle copies the expected `config/client_runtime.yml`."
