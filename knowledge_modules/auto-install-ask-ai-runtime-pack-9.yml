    \ 402\n\nThe current user plan is not entitled by billing mode logic. Confirm\
    \ `ASK_AI_BILLING_MODE` and user plan header.\n\n### Answer reports that it cannot\
    \ find the information\n\nThe runtime refuses to answer when retrieval returns\
