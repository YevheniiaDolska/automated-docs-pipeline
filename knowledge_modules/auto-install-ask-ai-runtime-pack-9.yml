    \n```json\n{\n  \"ok\": true,\n  \"enabled\": true,\n  \"provider\": \"openai\"\
    ,\n  \"billing_mode\": \"disabled\",\n  \"semantic_retrieval\": true,\n  \"reranking\"\
    : true,\n  \"hybrid_search\": true,\n  \"hyde\": true,\n  \"embedding_cache\"\
    : true\n}\n```\n\n## Next steps\n\n- [Configure Ask AI module](configure-ask-ai-module.md)\n\
