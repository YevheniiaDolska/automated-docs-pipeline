content:
  docs_markdown: "### Ask endpoint returns 402\n\nThe current user plan is not entitled\
    \ by billing mode logic. Confirm `ASK_AI_BILLING_MODE` and user plan header.\n\
    \n### Answer reports that it cannot find the information\n\nThe runtime refuses\
    \ to answer when retrieval returns no relevant sources, or when the sources do\
    \ not cover the question. This behavior prevents fabricated answers. Rebuild the\
    \ retrieval index so new documentation becomes searchable:\n\n```bash\npython3\
    \ scripts/generate_knowledge_retrieval_index.py\n```\n\nThe `/healthz` endpoint\
    \ reports the status of all advanced retrieval features:\n\n```json\n{\n  \"ok\"\
    : true,\n  \"enabled\": true,\n  \"provider\": \"openai\",\n  \"billing_mode\"\
    : \"disabled\",\n  \"semantic_retrieval\": true,\n  \"reranking\": true,\n  \"\
    hybrid_search\": true,\n  \"hyde\": true,\n  \"embedding_cache\": true\n}\n```\n\
    \n## Next steps\n\n- [Configure Ask AI module](configure-ask-ai-module.md)\n-\
    \ [Assemble intent experiences](assemble-intent-experiences.md)\n- [Intelligent\
    \ knowledge system architecture](../concepts/intelligent-knowledge-system.md)"
  assistant_context: "Use this module when answering questions related to: Install\
