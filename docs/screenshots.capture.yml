version: 1
defaults:
  storage_state: reports/playwright_storage_state.json
  viewport:
    width: 1440
    height: 900
  wait_for: networkidle
  full_page: false
auth:
  enabled: false
  login_url: ''
  storage_state_output: reports/playwright_storage_state.json
  steps:
  - type: fill
    selector: input[name='email']
    value: ${SCREENSHOT_LOGIN_EMAIL}
  - type: fill
    selector: input[name='password']
    value: ${SCREENSHOT_LOGIN_PASSWORD}
  - type: click
    selector: button[type='submit']
  - type: wait_for_selector
    selector: '[data-testid=''dashboard'']'
